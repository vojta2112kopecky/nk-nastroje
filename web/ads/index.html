  <!-- SBALOVACÍ SEKCE (FEEDBACK C3) — shell, NEsahá do window.ADS.  -->
  <!--                                                               -->
  <!-- Proč inline a ne v app.js: čistě prezentační vrstva shellu    -->
  <!-- (markup vlastní index.html, vzhled styles.css). Kdyby to měl  -->
  <!-- integrátor přesunout do app.js, stačí kód zkopírovat 1:1 —    -->

  <!--                                                               -->
  <!-- ⚠️ Sbaleno = CSS max-height:0 + visibility:hidden na .sec-body,-->
  <!-- NIKDY display:none / odstranění z DOM. Layout uvnitř tím      -->
  <!-- zůstává nedotčený → Tabulator si spočítá správné šířky sloupců-->
  <!-- a ECharts správnou velikost plátna i do SBALENÉ sekce. Proto  -->
  <!-- po rozbalení nic „nedoskakuje". resize dispatchujeme jen jako  -->
  <!-- pojistku (např. rozbalení po změně šířky okna).               -->
  <!-- ============================================================= -->
  <script>
  (function () {
    'use strict';
    var LS_PREFIX = 'ads.sec.v1.';
    var secs = [].slice.call(document.querySelectorAll('.sec[data-sec]'));
    if (!secs.length) return;

    function headOf(sec) { return sec.querySelector(':scope > .sec-h > .sec-head'); }

    function readState(name, dflt) {
      try {
        var v = localStorage.getItem(LS_PREFIX + name);
        return v === null ? dflt : v === '1';
      } catch (_) { return dflt; }   // private mode / zakázané úložiště → jen default
    }
    function writeState(name, open) {
      try { localStorage.setItem(LS_PREFIX + name, open ? '1' : '0'); } catch (_) {}
    }

    function apply(sec, open, persist) {
      var btn = headOf(sec);
      sec.classList.toggle('is-open', open);
      if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (persist) writeState(sec.getAttribute('data-sec'), open);
      if (open) { try { window.dispatchEvent(new Event('resize')); } catch (_) {} }
    }

    secs.forEach(function (sec) {
      var name = sec.getAttribute('data-sec');
      // default = SBALENO; výjimku si sekce řekne přes data-open-default="1"
      var dflt = sec.getAttribute('data-open-default') === '1';
      apply(sec, readState(name, dflt), false);
      var btn = headOf(sec);
      if (btn) btn.addEventListener('click', function () {
        apply(sec, !sec.classList.contains('is-open'), true);
      });
    });

    /* Zrcadlení počtu a podtitulu z těla sekce do záhlaví.
       Zdroj pravdy = .ash-count / .ash-sub, které renderuje tables.js (setCount).
       Bez toho by sbalená sekce neřekla, kolik v ní čeká položek — a to je přesně
       to, co Filip potřebuje vidět, aniž by rozbaloval.
       (Sekce grafů .ash-* nemá → zůstane fallback text z HTML.) */
    function sync() {
      for (var i = 0; i < secs.length; i++) {
        var sec = secs[i];
        var srcCount = sec.querySelector('.ash-count');
        var srcSub   = sec.querySelector('.ash-sub');
        var outCount = sec.querySelector('[data-sec-count]');
        var outSub   = sec.querySelector('[data-sec-sub]');
        if (outCount && srcCount) {
          var c = srcCount.textContent.trim();
          if (outCount.textContent !== c) outCount.textContent = c;
          outCount.hidden = !c;
        }
        if (outSub && srcSub) {
          var s = srcSub.textContent.trim();
          if (s && outSub.textContent !== s) outSub.textContent = s;
        }
      }
    }

    if (window.MutationObserver) {
      var queued = false;
      var mo = new MutationObserver(function () {
        if (queued) return;            // debounce na rAF — tables.js při renderu mutuje DOM hodně
        queued = true;
        requestAnimationFrame(function () { queued = false; sync(); });
      });
      secs.forEach(function (sec) {
        var body = sec.querySelector(':scope > .sec-body');
        if (body) mo.observe(body, { childList: true, subtree: true, characterData: true });
      });
    }
    sync();
  })();
  </script>
